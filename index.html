<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Apocalypse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2366ff00'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background: black;
      color: white;
    }

    /* =========================
       BACKGROUND IMAGE
    ========================== */
    .image-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image: url("ma-image.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* =========================
       DARK OVERLAY
    ========================== */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: rgba(0, 0, 0, 0.45);
    }

    /* =========================
       CONTENT
    ========================== */
    .content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .card {
      text-align: center;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 30px;
    }

    .logo {
      width: 100%;
      max-width: 300px;
    }

    p {
      margin-bottom: 25px;
      opacity: 0.85;
      line-height: 1.6;
    }

    /* =========================
       FORM
    ========================== */
    .signup input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .signup button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
      text-transform: uppercase;
    }

    .signup button:hover {
      transform: scale(1.03);
    }

    #success-msg {
      opacity: 0;
      margin-top: 10px;
      color: #9cff9c;
      transition: 0.3s ease;
    }

    /* =========================
       SOCIALS
    ========================== */
    .socials {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .socials a {
      color: white;
      text-decoration: none;
      opacity: 0.8;
    }

    .socials a:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="image-wrapper"></div>
  <div class="overlay"></div>

  <!-- CONTENT -->
  <main class="content">
    <div class="card">

      <!-- LOGO -->
      <img class="logo" src="ma-logo.png" alt="Merry Apocalypse" />

      <!-- TEXT -->
      <p>modern metal band from the Netherlands and Sweden, shaped by a dystopian world</p>

      <!-- MAILCHIMP FORM -->
      <form class="signup"
        action="https://merryapocalypseofficial.us1.list-manage.com/subscribe/post?u=b43c57706a57dc53e3f983f09&id=ea02ac87b2"
        method="post"
        target="hidden_iframe">

        <input type="email" name="EMAIL" required placeholder="Enter your email" />
        <button type="submit">Join Newsletter</button>
      </form>

      <iframe name="hidden_iframe" style="display:none;"></iframe>

      <!-- SUCCESS MESSAGE -->
      <p id="success-msg">You're in. Welcome to the apocalypse.</p>

      <!-- SOCIALS -->
      <div class="socials">
        <a href="https://www.instagram.com/merryapocalypseofficial/">Instagram</a>
        <a href="https://bandcamp.com/merryapocalypseofficial">Bandcamp</a>
        <a href="https://www.youtube.com/@MerryApocalypseOfficial">YouTube</a>
        <a href="https://www.tiktok.com/@merryapocalypseofficial">TikTok</a>
        <a href="https://www.facebook.com/merryapocalypseofficial/">Facebook</a>
      </div>

    </div>
  </main>

  <!-- SUCCESS SCRIPT -->
  <script>
    const form = document.querySelector('.signup');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', function () {
      setTimeout(() => {
        successMsg.style.opacity = 1;
      }, 600);
    });
  </script>

</body>
</html>
