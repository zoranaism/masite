<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Apocalypse</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
    }

    /* =========================
       BACKGROUND IMAGE (ACTIVE)
    ========================== */
    .image-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("./ma-image.jpg"); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* =========================
       BACKGROUND VIDEO (FUTURE)
       uncomment when ready
    ========================== */
    /*
    .video-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    */

    /* DARK OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    /* CONTENT */
    .content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      text-align: center;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 30px;
    }

    .logo {
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 30px;
      opacity: 0.85;
      line-height: 1.6;
    }

    /* FORM */
    .signup {
      margin-bottom: 20px;
    }

    .signup input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
    }

    .signup button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .signup button:hover {
      transform: scale(1.03);
    }

    /* SUCCESS MESSAGE */
    #success-msg {
      opacity: 0;
      transition: 0.3s ease;
      margin-top: 10px;
      color: #9cff9c;
    }

    /* SOCIALS */
    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .socials a {
      color: white;
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.8;
      transition: 0.3s ease;
    }

    .socials a:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       BACKGROUND (IMAGE ACTIVE)
  ========================== -->
  <div class="image-wrapper"></div>

  <!-- =========================
       BACKGROUND VIDEO (FUTURE)
  ========================== -->
  <!--
  <div class="video-wrapper">
    <video autoplay muted loop playsinline>
      <source src="your-video.mp4" type="video/mp4">
    </video>
  </div>
  -->

  <!-- DARK OVERLAY -->
  <div class="overlay"></div>

  <!-- CONTENT -->
  <main class="content">
    <div class="card">

      <!-- LOGO -->
      <img class="logo" src="./ma-logo.jpg" alt="Merry Apocalypse Logo" />

      <!-- TEXT -->
      <p>
        Cinematic progressive metal from another dimension.
      </p>

      <!-- MAILCHIMP FORM -->
      <form class="signup"
        action="https://merryapocalypseofficial.us1.list-manage.com/subscribe/post?u=b43c57706a57dc53e3f983f09&id=ea02ac87b2"
        method="post"
        target="hidden_iframe">

        <input type="email" name="EMAIL" required placeholder="Enter your email" />
        <button type="submit">Join Newsletter</button>

      </form>

      <!-- hidden iframe prevents redirect -->
      <iframe name="hidden_iframe" style="display:none;"></iframe>

      <!-- SUCCESS MESSAGE -->
      <p id="success-msg">🔥 You're in. Welcome to the apocalypse.</p>

      <!-- SOCIALS -->
      <div class="socials">
        <a href="#">Instagram</a>
        <a href="#">Spotify</a>
        <a href="#">YouTube</a>
        <a href="#">TikTok</a>
      </div>

    </div>
  </main>

  <!-- SUCCESS SCRIPT -->
  <script>
    const form = document.querySelector('.signup');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', function () {
      setTimeout(() => {
        successMsg.style.opacity = 1;
      }, 600);
    });
  </script>

</body>
</html>
